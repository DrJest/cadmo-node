  <script type="text/plain" id="c-connect">
// npm install mongoose
const mongoose = require('mongoose');

mongoose.set('debug', true);                 // stampa ogni operazione mandata a MongoDB

const libroSchema = new mongoose.Schema({
  titolo: String,
  anno: Number,
  generi: [String],
});
// 'Libro' → collezione "libros" (Mongoose fa il plurale in inglese): meglio dirlo noi
const Libro = mongoose.model('Libro', libroSchema, 'libri');

async function main() {
  await mongoose.connect(process.env.MONGODB_URI ?? 'mongodb://127.0.0.1:27017/biblioteca');
  console.log(await Libro.create({ titolo: 'Palomar', anno: 1983 }));
  await mongoose.disconnect();               // senza, il processo resta acceso
}
main();
</script>

const libroSchema = new mongoose.Schema({
  titolo: { type: String, required: [true, 'Il titolo è obbligatorio'], trim: true, maxLength: 200 },

  genere: { type: String, enum: ['romanzo', 'racconti', 'memorie'] },
  disponibile: { type: Boolean, default: true },

  <script type="text/plain" id="c-atomico">
// il prestito: filtro e modifica in UNA operazione sullo stesso documento → atomica
const presta = (id, lettore) => Libro.findOneAndUpdate(
  { _id: id, disponibile: true },                                   // solo se è disponibile
  { $set: { disponibile: false }, $push: { prestiti: { lettore } } },
  { returnDocument: 'after' },
);
await presta(id, 'Giulia');     // il libro aggiornato
await presta(id, 'Marco');      // null: nessun documento soddisfa il filtro (→ 409)

// la restituzione: $ = l'elemento dell'array trovato dal filtro
await Libro.findOneAndUpdate(
  { _id: id, 'prestiti.al': null },
  { $set: { disponibile: true, 'prestiti.$.al': new Date() } },
);
</script>

  <script type="text/plain" id="c-agg">
// una catena di stadi: ogni stadio riceve i documenti del precedente
await Libro.aggregate([
  { $match: { anno: { $gte: 1950 } } },                     // WHERE
  { $unwind: '$generi' },                                   // un documento per ogni genere
  { $group: {                                               // GROUP BY
    _id: '$generi',
    libri: { $sum: 1 },
    dal: { $min: '$anno' },
  } },
  { $sort: { libri: -1, _id: 1 } },                         // ORDER BY
  { $project: { _id: 0, genere: '$_id', libri: 1, dal: 1 } },
]);
// $lookup: { from: 'autori', localField: 'autore', foreignField: '_id', as: 'autore' } ≈ LEFT JOIN
</script>

  <script type="text/plain" id="c-errori">
// middleware/errori.js — gli errori di Mongoose diventano status HTTP
const mongoose = require('mongoose');

function gestoreErrori(err, req, res, next) {
  // … ErroreApi, JSON non valido (moduli 7, 9, 10) …
  if (err instanceof mongoose.Error.ValidationError) {          // lo schema rifiuta i dati
    const dettagli = Object.values(err.errors).map((e) => ({ campo: e.path, messaggio: e.message }));
    return res.status(400).json({ errore: 'Dati non validi', dettagli });
  }
  if (err instanceof mongoose.Error.CastError) {                // "42" come ObjectId, "abc" come numero
    return res.status(400).json({ errore: `Valore non valido per ${err.path}` });
  }
  if (err.code === 11000) {                                     // E11000 duplicate key
    return res.status(409).json({ errore: `Esiste già un elemento con questo ${Object.keys(err.keyValue)[0]}` });
  }
  console.error(err);
  res.status(500).json({ errore: 'Errore interno del server' });
}
</script>

  return { totale, pagina, libri };
}
