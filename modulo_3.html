  <!-- Server della "Pizzeria API" usato dalla simulazione finale (gira nel browser) -->
  <script type="text/plain" id="pizzeria-server">
const http = require('http');

let pizze = [
  { id: 1, nome: 'Margherita', prezzo: 6.5, ingredienti: ['pomodoro', 'mozzarella', 'basilico'] },
  { id: 2, nome: 'Marinara', prezzo: 5, ingredienti: ['pomodoro', 'aglio', 'origano'] },
  { id: 3, nome: 'Diavola', prezzo: 8, ingredienti: ['pomodoro', 'mozzarella', 'salame piccante'] },
  { id: 4, nome: 'Quattro formaggi', prezzo: 9.5, ingredienti: ['mozzarella', 'gorgonzola', 'fontina', 'parmigiano'] },
  { id: 5, nome: 'Capricciosa', prezzo: 10, ingredienti: ['pomodoro', 'mozzarella', 'prosciutto', 'funghi', 'carciofi'] },
];
let prossimoId = 6;

// Invia una risposta JSON (o vuota, per il 204) e scrive una riga di log
function invia(req, res, status, dati, headers = {}) {
  if (dati === undefined) {
    res.writeHead(status, headers);
    res.end();
  } else {
    res.writeHead(status, { 'Content-Type': 'application/json; charset=utf-8', ...headers });
    res.end(JSON.stringify(dati));
  }
  console.log(`${req.method} ${req.url} → ${status}`);
}

function paginaHtml() {
  const righe = pizze.map((p) => `<li><b>${p.nome}</b> — € ${p.prezzo.toFixed(2)}</li>`).join('');
  return `<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><title>Pizzeria Node</title></head>
<body style="font-family: sans-serif; padding: 16px">
  <h1>🍕 Pizzeria Node</h1>
  <p>Il nostro menù di oggi:</p>
  <ul>${righe}</ul>
  <p><small>I dati in formato JSON sono su <code>/api/pizze</code></small></p>
</body></html>`;
}

const server = http.createServer(async (req, res) => {
  const url = new URL(req.url, 'http://localhost');
  const parti = url.pathname.split('/').filter(Boolean); // es. ['api', 'pizze', '2']

  // Pagina HTML
  if (url.pathname === '/' && req.method === 'GET') {
    res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });
    res.end(paginaHtml());
    console.log(`${req.method} ${req.url} → 200`);
    return;
  }

  // Collezione: /api/pizze
  if (parti.length === 2 && parti[0] === 'api' && parti[1] === 'pizze') {
    if (req.method === 'GET') {
      const max = url.searchParams.get('max');
      if (max === null) return invia(req, res, 200, pizze);
      const limite = Number(max);
      if (max === '' || Number.isNaN(limite)) return invia(req, res, 400, { errore: 'Il parametro "max" deve essere un numero' });
      return invia(req, res, 200, pizze.filter((p) => p.prezzo <= limite));
    }
    if (req.method === 'POST') {
      let body = '';
      for await (const chunk of req) body += chunk;
      let dati;
      try {
        dati = JSON.parse(body);
      } catch {
        return invia(req, res, 400, { errore: 'Il body non è JSON valido' });
      }
      if (!dati || typeof dati.nome !== 'string' || !dati.nome.trim()) {
        return invia(req, res, 400, { errore: 'Il campo "nome" è obbligatorio' });
      }
      if (typeof dati.prezzo !== 'number' || dati.prezzo <= 0) {
        return invia(req, res, 400, { errore: 'Il campo "prezzo" deve essere un numero maggiore di 0' });
      }
      const nuova = {
        id: prossimoId++,
        nome: dati.nome.trim(),
        prezzo: dati.prezzo,
        ingredienti: Array.isArray(dati.ingredienti) ? dati.ingredienti : [],
      };
      pizze.push(nuova);
      return invia(req, res, 201, nuova, { Location: `/api/pizze/${nuova.id}` });
    }
    return invia(req, res, 405, { errore: `Metodo ${req.method} non consentito` }, { Allow: 'GET, POST' });
  }

  // Singola risorsa: /api/pizze/:id
  if (parti.length === 3 && parti[0] === 'api' && parti[1] === 'pizze') {
    const id = Number(parti[2]);
    const pizza = pizze.find((p) => p.id === id);
    if (req.method === 'GET' || req.method === 'DELETE') {
      if (!pizza) return invia(req, res, 404, { errore: `Pizza ${parti[2]} non trovata` });
      if (req.method === 'GET') return invia(req, res, 200, pizza);
      pizze = pizze.filter((p) => p.id !== id);
      return invia(req, res, 204);
    }
    return invia(req, res, 405, { errore: `Metodo ${req.method} non consentito` }, { Allow: 'GET, DELETE' });
  }

  invia(req, res, 404, { errore: 'Risorsa non trovata', percorso: url.pathname });
});

server.listen(3000, () => console.log('🍕 Pizzeria API in ascolto su http://localhost:3000'));
</script>
