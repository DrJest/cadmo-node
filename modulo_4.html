  <script type="text/plain" id="c-http">
// Modulo 3: solo il modulo http
const http = require('node:http');
const JSON_CT = { 'Content-Type': 'application/json' };

http.createServer((req, res) => {
  const url = new URL(req.url, 'http://x');
  const m = url.pathname.match(/^\/api\/libri\/(\d+)$/);
  if (req.method === 'GET' && m) {
    const id = Number(m[1]);
    const libro = libri.find((l) => l.id === id);
    if (!libro) {
      res.writeHead(404, JSON_CT);
      return res.end(JSON.stringify({ errore: 'No' }));
    }
    res.writeHead(200, JSON_CT);
    return res.end(JSON.stringify(libro));
  }
  // ...e così via per ogni rotta
}).listen(3000);
</script>
  <script type="text/plain" id="c-express">
// Modulo 4: Express
const express = require('express');
const app = express();

app.get('/api/libri/:id', (req, res) => {
  const id = Number(req.params.id);
  const libro = libri.find((l) => l.id === id);
  if (!libro) {
    return res.status(404).json({ errore: 'No' });
  }
  res.json(libro);
});

app.listen(3000);
</script>

  <script type="text/plain" id="c-body">
const app = express();
app.use(express.json());   // ← legge i body JSON e li mette in req.body

app.post('/api/libri', (req, res) => {
  const { titolo, autore } = req.body;
  if (!titolo || !autore) {
    return res.status(400).json({ errore: 'titolo e autore sono obbligatori' });
  }
  const libro = { id: prossimoId++, titolo, autore };
  libri.push(libro);
  res.status(201).location(`/api/libri/${libro.id}`).json(libro);
});
</script>

  <script type="text/plain" id="c-crud">
app.get('/api/libri', (req, res) => res.json(libri));

app.get('/api/libri/:id', (req, res) => {
  const libro = libri.find((l) => l.id === Number(req.params.id));
  if (!libro) return res.status(404).json({ errore: 'Libro non trovato' });
  res.json(libro);
});

app.delete('/api/libri/:id', (req, res) => {
  const i = libri.findIndex((l) => l.id === Number(req.params.id));
  if (i === -1) return res.status(404).json({ errore: 'Libro non trovato' });
  libri.splice(i, 1);
  res.sendStatus(204);
});
</script>

  <script type="text/plain" id="c-ex5">
// Express 5 usa una nuova sintassi per i percorsi
app.get('/download/*file', ...);    // /download/foto/2026/mare.jpg
                                    // → req.params.file = ['foto','2026','mare.jpg']
app.get('/meteo{/:citta}', ...);    // /meteo  e  /meteo/Roma  (parte opzionale)

app.get('*', ...);          // ❌ PathError [TypeError]: Missing parameter name at index 1: *
app.get('/libri/:id?', ...);// ❌ PathError [TypeError]: Unexpected ? at index 10: /libri/:id?
app.use((req, res) => {     // ✅ "tutto il resto": app.use in fondo
  res.status(404).json({ errore: 'Pagina inesistente' });
});

// Gli errori nelle funzioni async vengono gestiti da Express (risposta 500)
app.get('/api/dati', async (req, res) => {
  const dati = await leggiDati();   // se fallisce → 500, il server NON crasha
  res.json(dati);
});
</script>
