  <script type="text/plain" id="c-modello">
// models/utente.js
const utenteSchema = new mongoose.Schema({
  email: { type: String, required: true, unique: true, lowercase: true, trim: true },
  nome: { type: String, required: true },
  password: { type: String, required: true, minLength: 8, select: false },   // mai nelle query
  ruolo: { type: String, enum: ['lettore', 'bibliotecario'], default: 'lettore' },
}, { toJSON: { transform(doc, ret) { delete ret.password; return ret; } } });

// prima la validazione (minLength sulla password in chiaro), poi l'hash
utenteSchema.pre('save', async function () {          // Mongoose 9: niente next()
  if (!this.isModified('password')) return;
  this.password = await bcrypt.hash(this.password, 10);
});

utenteSchema.methods.verificaPassword = function (password) {
  return bcrypt.compare(password, this.password);
};
</script>

  <script type="text/plain" id="c-session">
const session = require('express-session');         // npm install express-session

app.use(session({
  secret: process.env.SESSION_SECRET,               // firma il cookie
  resave: false,
  saveUninitialized: false,                         // niente sessione (e cookie) prima del login
  cookie: { httpOnly: true, sameSite: 'lax', maxAge: 60 * 60 * 1000 },
}));

app.post('/login', async (req, res, next) => {
  // … utente e password controllati come prima …
  req.session.regenerate((err) => {                 // un id NUOVO dopo il login
    if (err) return next(err);
    req.session.utente = { id: utente.id, ruolo: utente.ruolo };
    res.json({ nome: utente.nome });
  });
});

const richiediLogin = (req, res, next) => (req.session.utente ? next() : res.sendStatus(401));
app.post('/logout', (req, res) => req.session.destroy(() => res.clearCookie('connect.sid').sendStatus(204)));
</script>

const jwt = require('jsonwebtoken');                 // npm install jsonwebtoken

const token = jwt.sign(

  <script type="text/plain" id="c-auth">
// middleware/auth.js
function autentica(req, res, next) {
  const [schema, token] = (req.get('Authorization') ?? '').split(' ');
  if (schema !== 'Bearer' || !token) throw new NonAutenticato('Serve il login');
  try {
    const p = jwt.verify(token, config.jwtSecret, { algorithms: ['HS256'] });
    req.utente = { id: p.sub, ruolo: p.ruolo };       // per le rotte successive
  } catch (err) {
    throw new NonAutenticato(err.name === 'TokenExpiredError' ? 'Token scaduto' : 'Token non valido');
  }
  next();
}

// una "fabbrica" di middleware: autorizza('bibliotecario')
const autorizza = (...ruoli) => (req, res, next) => {
  if (!ruoli.includes(req.utente.ruolo)) throw new Vietato('Permesso negato');   // → 403
  next();
};

router.get('/', elenco);                                          // pubblica
router.post('/:id/prestito', autentica, presta);                  // con il login
router.delete('/:id', autentica, autorizza('bibliotecario'), elimina);
</script>

// login: l'access token nel body, il refresh token in un cookie HttpOnly
res.cookie('refresh', jwt.sign({ sub, v: utente.versioneToken }, REFRESH_SECRET, { expiresIn: '7d' }),
  { httpOnly: true, sameSite: 'strict', path: '/api/auth', maxAge: 7 * 24 * 3600 * 1000 });
res.json({ accessToken: jwt.sign({ sub, ruolo }, JWT_SECRET, { expiresIn: '15m' }) });

// POST /api/auth/refresh: il browser manda il cookie da solo
const p = jwt.verify(req.cookies.refresh, REFRESH_SECRET);
const utente = await Utente.findById(p.sub).select('+versioneToken');
if (utente.versioneToken !== p.v) throw new NonAutenticato('Sessione chiusa');
// → un access token nuovo (e un refresh token nuovo: "rotazione")

// POST /api/auth/logout: $inc versioneToken → i refresh token vecchi non valgono più
</script>
