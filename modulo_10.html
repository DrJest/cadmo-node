// npm install typeorm better-sqlite3
const { DataSource } = require('typeorm');

const AppDataSource = new DataSource({
  type: 'better-sqlite3',                 // TypeORM 1.x: SQLite si usa così
  database: 'data/biblioteca.db',
  entities: [Autore, Libro, Genere],      // le entità (prossima slide)
  synchronize: true,                      // crea le tabelle all'avvio (solo in sviluppo!)
  logging: ['query', 'error'],            // stampa l'SQL che TypeORM esegue
});

// server.js — prima il database, poi il server
AppDataSource.initialize()
  .then(() => app.listen(3000))
  .catch((err) => { console.error(err); process.exit(1); });
</script>

// entities/libro.js
const { EntitySchema } = require('typeorm');

module.exports = new EntitySchema({
  name: 'Libro',                       // il nome dell'entità
  tableName: 'libri',                  // il nome della tabella
  columns: {
    id:          { type: Number, primary: true, generated: true },
    titolo:      { type: String },
    anno:        { type: Number, nullable: true },
    isbn:        { type: String, nullable: true, unique: true },
    disponibile: { type: Boolean, default: true },
  },
});
</script>

const { MoreThan, Like, In, IsNull } = require('typeorm');

await libri.find({
  where: { anno: MoreThan(1960), titolo: Like('Il %') },   // AND
  order: { anno: 'DESC' },
  skip: 0, take: 10,                                       // paginazione
  select: { id: true, titolo: true },                      // solo queste colonne
});

await libri.find({ where: [{ anno: IsNull() }, { disponibile: false }] });   // array = OR
const [righe, totale] = await libri.findAndCount({ take: 10 });
</script>

// entities/libro.js — ogni libro ha UN autore
relations: {
  autore: {
    type: 'many-to-one', target: 'Autore', inverseSide: 'libri',
    joinColumn: { name: 'autore_id' },        // la chiave esterna (modulo 9)
    nullable: false,                          // obbligatoria → INNER JOIN
  },
},

// entities/autore.js — un autore ha MOLTI libri (il lato inverso: nessuna colonna)
relations: {
  libri: { type: 'one-to-many', target: 'Libro', inverseSide: 'autore' },
},

await libri.save({ titolo: 'Palomar', autore: { id: 1 } });   // basta l'id
await libri.find({ relations: { autore: true }, where: { autore: { nome: Like('%Levi%') } } });
await autori.find({ relations: { libri: true } });             // anche dall'altro lato
</script>

  <script type="text/plain" id="c-qb">
const [libri, totale] = await AppDataSource.getRepository(Libro)
  .createQueryBuilder('l')                          // l = alias di "libri"
  .innerJoinAndSelect('l.autore', 'a')              // JOIN + carica l'autore
  .leftJoinAndSelect('l.generi', 'g')
  .where('a.nome LIKE :autore', { autore: '%calvino%' })   // :autore = parametro
  .andWhere('l.anno > :anno', { anno: 1950 })
  .orderBy('l.anno', 'DESC')
  .skip(0).take(10)
  .getManyAndCount();                               // entità + totale

// righe "grezze": raggruppamenti e conteggi
await repoAutori.createQueryBuilder('a')
  .leftJoin('a.libri', 'l')
  .select('a.nome', 'autore')
  .addSelect('COUNT(l.id)', 'libri')
  .groupBy('a.id')
  .getRawMany();                    // [{ autore: 'Alda Merini', libri: 0 }, …]
</script>

  <script type="text/plain" id="c-tx">
// il prestito: due modifiche, tutte e due o nessuna
function presta(id, lettore) {
  return AppDataSource.transaction(async (manager) => {    // BEGIN
    const libro = await manager.findOneBy(Libro, { id });
    if (!libro) throw new NonTrovato('Il libro non esiste');            // → ROLLBACK
    if (!libro.disponibile) throw new Conflitto('Già in prestito');     // → ROLLBACK
    await manager.save(Prestito, { libro, lettore, dal: oggi() });
    await manager.update(Libro, id, { disponibile: false });
  });                                                        // COMMIT
}
</script>

// data-source.js
synchronize: false,                                       // lo schema lo cambiano SOLO le migrazioni
migrations: [path.join(__dirname, 'migrations', '*.js')],
migrationsRun: true,                                      // all'avvio: quelle nuove

// migrations/1762506000000-AggiungiIsbn.js
module.exports = class AggiungiIsbn1762506000000 {       // il numero = quando è stata creata
  async up(queryRunner) {
    await queryRunner.query(`ALTER TABLE "libri" ADD COLUMN "isbn" varchar`);
  }
  async down(queryRunner) {                               // per tornare indietro
    await queryRunner.query(`ALTER TABLE "libri" DROP COLUMN "isbn"`);
  }
};
</script>

  <script type="text/plain" id="c-errori">
// middleware/errori.js
const { QueryFailedError, EntityNotFoundError } = require('typeorm');

function gestoreErrori(err, req, res, next) {
  // … ErroreApi, JSON non valido (moduli 7 e 9) …
  if (err instanceof EntityNotFoundError) {             // findOneByOrFail, findOneOrFail
    return res.status(404).json({ errore: 'Risorsa non trovata' });
  }
  if (err instanceof QueryFailedError) {                // l'errore del database
    if (err.code === 'SQLITE_CONSTRAINT_UNIQUE') {      // 'UNIQUE constraint failed: libri.isbn'
      return res.status(409).json({ errore: 'ISBN già presente' });
    }
    if (err.code === 'SQLITE_CONSTRAINT_FOREIGNKEY') {
      return res.status(409).json({ errore: 'Ci sono dati collegati' });
    }
  }
  console.error(err);                                   // tutto il resto è un bug → 500
  res.status(500).json({ errore: 'Errore interno del server' });
}
</script>
  <script type="text/plain" id="c-repo">
// repositories/libri.js — stessi nomi del modulo 9: le rotte non cambiano (aggiungono solo await)
const repo = () => AppDataSource.getRepository(Libro);

function trova(id) {
  return repo().findOne({ where: { id }, relations: { autore: true, generi: true } });
}

async function crea({ autore_id, generi = [], ...dati }) {
  const libro = repo().create({ ...dati, autore: { id: autore_id }, generi: generi.map((id) => ({ id })) });
  await repo().save(libro);              // INSERT + le righe della tabella ponte
  return trova(libro.id);
}

async function elimina(id) {
  return (await repo().delete(id)).affected > 0;    // 0 → 404
}

// routes/libri.js
router.get('/:id', async (req, res) => {
  const l = await libri.trova(Number(req.params.id));
  if (!l) throw new NonTrovato('Il libro non esiste');   // Express 5: async gestito
  res.json(l);
});
</script>
