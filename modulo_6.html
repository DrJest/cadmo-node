  <script type="text/plain" id="c-crud-read">
const express = require('express');
const router = express.Router();

const libri = [
  { id: 1, titolo: 'Il nome della rosa', autore: 'Umberto Eco', anno: 1980, disponibile: true },
  { id: 2, titolo: 'Il barone rampante', autore: 'Italo Calvino', anno: 1957, disponibile: false },
];
let prossimoId = 3;

function trova(id) {
  return libri.find((l) => l.id === Number(id));   // i params sono STRINGHE
}

router.get('/', (req, res) => {
  res.json(libri);
});

router.get('/:id', (req, res) => {
  const libro = trova(req.params.id);
  if (!libro) return res.status(404).json({ errore: 'Libro non trovato' });
  res.json(libro);
});

module.exports = router;     // in app.js: app.use('/api/libri', router)
</script>
  <script type="text/plain" id="c-crud-write">
router.post('/', (req, res) => {
  const { titolo, autore, anno } = req.body ?? {};
  if (!titolo || !autore) {
    return res.status(400).json({ errore: 'titolo e autore sono obbligatori' });
  }
  const libro = { id: prossimoId++, titolo, autore, anno: anno ?? null, disponibile: true };
  libri.push(libro);
  res.status(201).location(`/api/libri/${libro.id}`).json(libro);
});

router.delete('/:id', (req, res) => {
  const i = libri.findIndex((l) => l.id === Number(req.params.id));
  if (i === -1) return res.status(404).json({ errore: 'Libro non trovato' });
  libri.splice(i, 1);
  res.sendStatus(204);
});
</script>

  <script type="text/plain" id="c-crud-update">
// i soli campi che il client può scrivere: niente id, niente "admin": true…
const CAMPI = ['titolo', 'autore', 'anno', 'disponibile'];

function scegliCampi(body) {
  const dati = {};
  for (const campo of CAMPI) {
    if (body?.[campo] !== undefined) dati[campo] = body[campo];
  }
  return dati;
}

router.put('/:id', (req, res) => {             // sostituisce tutto
  const libro = trova(req.params.id);
  if (!libro) return res.status(404).json({ errore: 'Libro non trovato' });
  const dati = scegliCampi(req.body);
  if (!dati.titolo || !dati.autore) {
    return res.status(400).json({ errore: 'titolo e autore sono obbligatori' });
  }
  Object.assign(libro, { anno: null, disponibile: true }, dati);
  res.json(libro);
});

router.patch('/:id', (req, res) => {           // solo ciò che arriva
  const libro = trova(req.params.id);
  if (!libro) return res.status(404).json({ errore: 'Libro non trovato' });
  Object.assign(libro, scegliCampi(req.body));
  res.json(libro);
});
</script>

  <script type="text/plain" id="c-filtri">
// GET /api/libri?autore=calvino&genere=romanzo&disponibile=true
router.get('/', (req, res) => {
  let risultato = libri;
  const { autore, genere, disponibile } = req.query;

  if (autore) {
    risultato = risultato.filter((l) => l.autore.toLowerCase().includes(autore.toLowerCase()));
  }
  if (genere) {
    risultato = risultato.filter((l) => l.genere === genere);
  }
  if (disponibile !== undefined) {
    // ⚠️ nella query è tutto STRINGA: 'false' è una stringa "vera"!
    risultato = risultato.filter((l) => l.disponibile === (disponibile === 'true'));
  }
  res.json(risultato);
});

// ?autore=calvino&anno=1957&tag=a&tag=b
// req.query → { autore: 'calvino', anno: '1957', tag: ['a', 'b'] }
</script>
  <script type="text/plain" id="c-ordina">
// GET /api/libri?ordina=anno     crescente
// GET /api/libri?ordina=-anno    decrescente (il "-" davanti)
const ORDINABILI = ['titolo', 'autore', 'anno'];

function ordina(lista, criterio) {
  const campo = criterio.replace(/^-/, '');
  if (!ORDINABILI.includes(campo)) {
    throw creaErrore(400, `Si può ordinare per: ${ORDINABILI.join(', ')}`);
  }
  const verso = criterio.startsWith('-') ? -1 : 1;
  return lista.toSorted((a, b) => {        // una copia: l'originale non cambia
    const x = a[campo];
    const y = b[campo];
    return (typeof x === 'string' ? x.localeCompare(y, 'it') : x - y) * verso;
  });
}
</script>
  <script type="text/plain" id="c-pagina">
// GET /api/libri?pagina=2&limite=5
router.get('/', (req, res) => {
  const pagina = Number(req.query.pagina ?? 1);
  const limite = Number(req.query.limite ?? 10);
  if (!Number.isInteger(pagina) || pagina < 1) {
    return res.status(400).json({ errore: 'pagina deve essere un intero ≥ 1' });
  }
  if (!Number.isInteger(limite) || limite < 1 || limite > 50) {
    return res.status(400).json({ errore: 'limite deve essere un intero tra 1 e 50' });
  }
  const inizio = (pagina - 1) * limite;
  res.json({
    dati: libri.slice(inizio, inizio + limite),
    pagina,
    limite,
    totale: libri.length,
    pagine: Math.ceil(libri.length / limite),
  });
});
</script>

const path = require('path');

const FILE = path.join(__dirname, 'data', 'libri.json');

async function leggiLibri() {

  <script type="text/plain" id="c-file-crud">
router.get('/', async (req, res) => {
  res.json(await leggiLibri());
});

router.post('/', async (req, res) => {
  const { titolo, autore } = req.body ?? {};
  if (!titolo || !autore) return res.status(400).json({ errore: 'titolo e autore sono obbligatori' });

  const libri = await leggiLibri();                        // 1. leggi
  const id = Math.max(0, ...libri.map((l) => l.id)) + 1;   //    l'id più alto + 1
  const libro = { id, titolo, autore, disponibile: true };
  libri.push(libro);                                       // 2. modifica
  await salvaLibri(libri);                                 // 3. scrivi
  res.status(201).location(`/api/libri/${id}`).json(libro);
});

router.delete('/:id', async (req, res) => {
  const libri = await leggiLibri();
  const i = libri.findIndex((l) => l.id === Number(req.params.id));
  if (i === -1) return res.status(404).json({ errore: 'Libro non trovato' });
  libri.splice(i, 1);
  await salvaLibri(libri);
  res.sendStatus(204);
});

  <script type="text/plain" id="c-repo">
// data/libriRepo.js — l'UNICO file che sa dove stanno i libri
const fs = require('fs/promises');
const path = require('path');

const FILE = path.join(__dirname, 'libri.json');

async function tutti() {
  return JSON.parse(await fs.readFile(FILE, 'utf8'));
}

async function salva(libri) {
  await fs.writeFile(FILE + '.tmp', JSON.stringify(libri, null, 2));
  await fs.rename(FILE + '.tmp', FILE);
}

async function trova(id) {
  return (await tutti()).find((l) => l.id === id) ?? null;
}

async function crea(dati) {
  const libri = await tutti();
  const libro = { id: Math.max(0, ...libri.map((l) => l.id)) + 1, ...dati };
  libri.push(libro);
  await salva(libri);
  return libro;
}

// aggiorna(id, dati) ed elimina(id): stessa idea (leggi → modifica → salva)

module.exports = { tutti, trova, crea, aggiorna, elimina };
</script>
