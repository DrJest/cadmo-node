  <script type="text/plain" id="c-static-prefix">
// un prefisso nell'URL (che NON fa parte del percorso del file)
app.use('/static', express.static(path.join(__dirname, 'public')));
// GET /static/style.css  → public/style.css

// più cartelle: vengono provate in ordine
app.use(express.static(path.join(__dirname, 'public')));
app.use('/uploads', express.static(path.join(__dirname, 'uploads')));

// opzioni: niente index.html automatico
app.use('/archivio', express.static(path.join(__dirname, 'archivio'), { index: false }));

// un middleware è una funzione con TRE parametri
function logger(req, res, next) {
  console.log(`${req.method} ${req.url}`);
  next();                              // passa la richiesta al prossimo
}

app.use(logger);                       // per TUTTE le richieste

// li conoscete già: sono middleware anche questi
app.use(express.json());               // legge il body → req.body
app.use(express.static('public'));     // risponde con un file… o chiama next()
</script>

  <script type="text/plain" id="c-mw-bugs">
// ❌ 1. né risposta né next(): il client aspetta… per sempre
app.use((req, res, next) => {
  console.log(req.url);
});

// ❌ 2. risposta E next(): qualcun altro proverà a rispondere
app.use((req, res, next) => {
  if (!req.get('X-Api-Key')) res.status(401).json({ errore: 'Chiave mancante' });
  next();
});
// → Error [ERR_HTTP_HEADERS_SENT]: Cannot set headers after they are sent to the client

// ✅ o rispondi (con return), o chiami next(): mai entrambe le cose
app.use((req, res, next) => {
  if (!req.get('X-Api-Key')) return res.status(401).json({ errore: 'Chiave mancante' });
  next();
});
</script>

  <script type="text/plain" id="c-logger">
function logger(req, res, next) {
  const inizio = Date.now();
  // 'finish' scatta quando la risposta è stata inviata:
  // solo ora conosciamo lo status!
  res.on('finish', () => {
    const ms = Date.now() - inizio;
    console.log(`${req.method} ${req.originalUrl} → ${res.statusCode} (${ms} ms)`);
  });
  next();
}

app.use(logger);
</script>

  <script type="text/plain" id="c-chiave">
function richiedeChiave(req, res, next) {
  const chiave = req.get('X-Api-Key');
  if (!chiave) {
    return res.status(401).json({ errore: 'Chiave mancante' });
  }
  if (chiave !== 'cadmo') {
    return res.status(403).json({ errore: 'Chiave non valida' });
  }
  next();                                    // tutto ok: avanti
}

app.get('/api/libri', elencoLibri);                       // libera
app.post('/api/libri', richiedeChiave, aggiungiLibro);    // protetta
app.delete('/api/libri/:id', richiedeChiave, eliminaLibro);
</script>
  <script type="text/plain" id="c-factory">
// una funzione che CREA e restituisce un middleware
function richiedeRuolo(ruolo) {
  return (req, res, next) => {
    if (req.get('X-Ruolo') !== ruolo) {        // (per esercizio: il ruolo vero
      return res.status(403).json({            //  arriverà dal login, modulo 12)
        errore: `Serve il ruolo ${ruolo}`,
      });
    }
    next();
  };
}

app.delete('/api/libri/:id', richiedeRuolo('bibliotecario'), eliminaLibro);
app.use('/api/admin', richiedeRuolo('direttore'));

// ecco perché si scrive morgan('dev') e cors({ ... }) con le parentesi:
// sono "fabbriche" che restituiscono un middleware già configurato
</script>

  <script type="text/plain" id="c-handler">
// l'ULTIMO della fila, con QUATTRO parametri
app.use((err, req, res, next) => {
  if (err.type === 'entity.parse.failed') {      // body JSON rotto
    return res.status(400).json({ errore: 'JSON non valido' });
  }
  const status = err.status || 500;
  if (status === 500) console.error(err);        // i dettagli restano nel terminale
  res.status(status).json({
    errore: status === 500 ? 'Errore interno del server' : err.message,
  });
});
</script>
  <script type="text/plain" id="c-sources">
function creaErrore(status, messaggio) {
  const err = new Error(messaggio);
  err.status = status;
  return err;
}

// 1. throw in una rotta
app.get('/api/libri/:id', (req, res) => {
  const libro = libri.find((l) => l.id === Number(req.params.id));
  if (!libro) throw creaErrore(404, 'Libro non trovato');
  res.json(libro);
});

// 2. next(err) esplicito
app.post('/api/prestiti', (req, res, next) => {
  if (!libro.disponibile) return next(creaErrore(409, 'Libro già in prestito'));
  // ...
});

// 3. async: con Express 5 la Promise rifiutata arriva da sola al gestore
app.get('/api/catalogo', async (req, res) => {
  const testo = await fs.promises.readFile('data/libri.json', 'utf8');
  res.json(JSON.parse(testo));
});

// 4. dai middleware: express.json() con un body rotto → next(err)
//    con err.status = 400 e err.type = 'entity.parse.failed'
</script>
  <script type="text/plain" id="c-traps">
// ❌ errore dentro una callback: Express NON lo vede → crash di tutto il server
app.get('/api/vecchio', (req, res) => {
  fs.readFile('data/libri.json', 'utf8', (err, testo) => {
    res.json(JSON.parse(testo));        // file rotto? 💥 il processo termina
  });
});

// ✅ con le Promise e async/await l'errore arriva al gestore (500)
app.get('/api/nuovo', async (req, res) => {
  const testo = await fs.promises.readFile('data/libri.json', 'utf8');
  res.json(JSON.parse(testo));
});

// Express 4 (tutorial vecchi): gli errori async andavano passati a mano
app.get('/api/express4', async (req, res, next) => {
  try {
    res.json(await leggiCatalogo());
  } catch (err) {
    next(err);
  }
});
</script>

// app.js
const app = express();

app.use(morgan('dev'));                                    // 1. log: per primo, vede tutto
app.use(cors({ origin: 'http://localhost:5500' }));        // 2. CORS: prima delle rotte
app.use(express.json());                                   // 3. body: prima di chi usa req.body

app.use('/api/libri', libriRouter);                        // 5. le rotte
app.use('/api/autori', autoriRouter);

app.use(nonTrovato);                                       // 6. 404: dopo tutte le rotte
app.use(gestoreErrori);                                    // 7. errori: sempre l'ultimo

module.exports = app;
</script>
