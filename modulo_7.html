  <script type="text/plain" id="c-mano">
function validaLibro(body) {
  if (typeof body !== 'object' || body === null || Array.isArray(body)) {
    return ['il body deve essere un oggetto'];
  }
  const errori = [];
  if (typeof body.titolo !== 'string' || body.titolo.trim() === '') errori.push('titolo obbligatorio');
  else if (body.titolo.length > 200) errori.push('titolo troppo lungo');
  if (typeof body.autore !== 'string' || body.autore.trim() === '') errori.push('autore obbligatorio');
  if (body.anno !== undefined && (!Number.isInteger(body.anno) || body.anno < 1450 || body.anno > 2100)) {
    errori.push('anno non valido');
  }
  if (body.genere !== undefined && !['romanzo', 'giallo', 'poesia'].includes(body.genere)) {
    errori.push('genere non valido');
  }
  if (body.disponibile !== undefined && typeof body.disponibile !== 'boolean') {
    errori.push('disponibile deve essere true o false');
  }
  return errori;
  // …e poi bisogna ancora togliere gli spazi, scartare i campi in più, mettere i predefiniti…
}
</script>

  <script type="text/plain" id="c-messaggi">
// 1. per una regola: il messaggio come argomento
z.string().trim().min(1, 'Il titolo non può essere vuoto');

// 2. per il tipo (campo mancante o sbagliato): nel costruttore
z.string({ error: 'Il titolo è obbligatorio' });
z.int('anno deve essere un numero intero');             // forma breve

// 3. una funzione: messaggi diversi a seconda del problema
z.string({
  error: (iss) => (iss.input === undefined ? 'Campo obbligatorio' : 'Deve essere un testo'),
});

// 4. una volta per tutta l'applicazione (prima di creare gli schemi)
z.config({
  customError: (iss) => {
    if (iss.code === 'invalid_type' && iss.input === undefined) return 'Campo obbligatorio';
    if (iss.code === 'too_small' && iss.origin === 'string') return `Almeno ${iss.minimum} caratteri`;
    // undefined → il messaggio standard
  },
});
// sul vostro PC ci sono anche le traduzioni già pronte: z.config(z.locales.it())

// lo schema "base": i campi che il client può scrivere, SENZA .default()
const libro = z.strictObject({
  titolo: z.string().trim().min(1),
  autore: z.string().trim().min(1),
  anno: z.int().min(1450).max(2100).nullable().optional(),
  disponibile: z.boolean().optional(),
});

const creaLibro = libro;                                   // POST e PUT
const modificaLibro = libro.partial();                     // PATCH: tutto facoltativo
const soloTitolo = libro.pick({ titolo: true });           // solo alcuni campi
const senzaAnno = libro.omit({ anno: true });              // tutti tranne alcuni
const conIsbn = libro.extend({ isbn: z.string().length(13) });

// ⚠️ zod 4 applica i .default() anche dentro .partial():
//    con disponibile: z.boolean().default(true), il PATCH { "anno": 1990 }
//    rimetterebbe disponibile a true! I valori predefiniti si danno alla CREAZIONE.
</script>
  <script type="text/plain" id="c-refine">
// una regola su più campi: refine sull'oggetto intero
const periodo = z.object({
  annoDa: z.coerce.number().int().optional(),
  annoA: z.coerce.number().int().optional(),
}).refine((q) => q.annoDa === undefined || q.annoA === undefined || q.annoDa <= q.annoA, {
  error: 'annoDa deve essere minore o uguale ad annoA',
  path: ['annoDa'],                      // il campo a cui "appartiene" l'errore
});

// PATCH: tutto facoltativo, ma almeno un campo
const modificaLibro = libro.partial()
  .refine((dati) => Object.keys(dati).length > 0, 'Nessun campo da modificare');

// transform + pipe: trasformare e poi validare di nuovo
const isbn = z.string()
  .transform((s) => s.replaceAll('-', ''))
  .pipe(z.string().length(13));

isbn.parse('978-88-06-21945-6');        // '9788806219456'
</script>

z.coerce.boolean().parse('false');     // true   😱
z.stringbool().parse('false');         // false  ✅  (anche '1'/'0', 'yes'/'no', 'on'/'off'…)

  <script type="text/plain" id="c-valida">
// middleware/valida.js — una fabbrica di middleware (come richiedeChiave nel modulo 5)
function valida(schemi) {
  return (req, res, next) => {
    req.valido = {};
    for (const parte of ['params', 'query', 'body']) {
      if (!schemi[parte]) continue;
      const r = schemi[parte].safeParse(req[parte] ?? {});
      if (!r.success) {
        return res.status(400).json({
          errore: 'Dati non validi',
          dettagli: r.error.issues.map((i) => ({
            campo: i.path.length ? i.path.join('.') : parte,
            messaggio: i.message,
          })),
        });
      }
      req.valido[parte] = r.data;     // ⚠️ req.query = r.data NON funziona in Express 5
    }
    next();
  };
}
</script>

  <script type="text/plain" id="c-classi">
// errori.js
class ErroreApi extends Error {
  constructor(status, messaggio, dettagli) {
    super(messaggio);                    // message (e lo stack)
    this.name = this.constructor.name;   // 'NonTrovato', 'Conflitto'…
    this.status = status;
    this.dettagli = dettagli;
  }
}
class RichiestaNonValida extends ErroreApi {
  constructor(messaggio = 'Dati non validi', dettagli) { super(400, messaggio, dettagli); }
}
class NonAutorizzato extends ErroreApi {
  constructor(messaggio = 'Chiave API mancante o non valida') { super(401, messaggio); }
}
class NonTrovato extends ErroreApi {
  constructor(messaggio = 'Risorsa non trovata') { super(404, messaggio); }
}
class Conflitto extends ErroreApi {
  constructor(messaggio) { super(409, messaggio); }
}

const e = new NonTrovato('Il libro 7 non esiste');
console.log(e instanceof NonTrovato, e instanceof ErroreApi, e instanceof Error);
console.log(e.name, e.status, e.message);
</script>

  <script type="text/plain" id="c-gestore">
// middleware/errori.js — l'UNICO posto che trasforma un errore in una risposta
function nonTrovato(req, res, next) {
  next(new NonTrovato(`Rotta non trovata: ${req.method} ${req.originalUrl}`));
}

// 4 parametri: obbligatori, anche se next non si usa!
function gestoreErrori(err, req, res, next) {
  // risposta già partita: non si può più cambiare, ci pensa Express
  if (res.headersSent) return next(err);

  // 1. errori previsti: il loro status, il loro messaggio
  if (err instanceof ErroreApi) {
    const corpo = { errore: err.message };
    if (err.dettagli) corpo.dettagli = err.dettagli;
    return res.status(err.status).json(corpo);
  }
  // 2. JSON rotto (da express.json)
  if (err.type === 'entity.parse.failed') {
    return res.status(400).json({ errore: 'JSON non valido' });
  }
  // 3. un bug: tutto nel log con un id, al client niente dettagli
  const id = crypto.randomUUID().slice(0, 8);
  console.error(`💥 [${id}] ${req.method} ${req.originalUrl}`, err);
  res.status(500).json({ errore: 'Errore interno del server', id });
}

// app.js, in fondo a tutto:
// app.use(nonTrovato);
// app.use(gestoreErrori);
</script>

  <script type="text/plain" id="c-config">
// config.js — l'UNICO file che legge process.env
const { z } = require('zod');

const schema = z.object({
  PORT: z.coerce.number().int().min(1).max(65535).default(3000),
  NODE_ENV: z.enum(['development', 'production', 'test']).default('development'),
  BIBLIOTECA_NOME: z.string().min(1).default('Biblioteca'),
  API_KEY: z.string().min(16, 'API_KEY deve avere almeno 16 caratteri'),
  LIMITE_MASSIMO: z.coerce.number().int().min(1).max(100).default(50),
});

const risultato = schema.safeParse(process.env);
if (!risultato.success) {
  console.error('❌ Configurazione non valida:\n' + z.prettifyError(risultato.error));
  process.exit(1);                         // fail fast: meglio non partire che partire male
}

module.exports = Object.freeze(risultato.data);
</script>

  <script type="text/plain" id="c-service">
// services/libriService.js — le regole: niente req, niente res, niente status
const repo = require('../repositories/libriRepo');
const { NonTrovato, Conflitto } = require('../errori');

async function leggi(id) {
  const libro = await repo.trova(id);
  if (!libro) throw new NonTrovato(`Il libro ${id} non esiste`);
  return libro;
}

async function crea(dati) {
  const libri = await repo.tutti();
  if (libri.some((l) => stesso(l.titolo, dati.titolo) && stesso(l.autore, dati.autore))) {
    throw new Conflitto('Questo libro è già in catalogo');
  }
  return repo.crea({ anno: null, genere: null, disponibile: true, ...dati });
}

async function presta(id) {
  const libro = await leggi(id);
  if (!libro.disponibile) throw new Conflitto(`"${libro.titolo}" è già in prestito`);
  return repo.aggiorna(id, { ...libro, disponibile: false });
}
</script>
