  <script type="text/plain" id="c-create">
CREATE TABLE autori (
  id   INTEGER PRIMARY KEY,                -- il numero lo sceglie SQLite
  nome TEXT NOT NULL UNIQUE
);

CREATE TABLE libri (
  id          INTEGER PRIMARY KEY,
  titolo      TEXT NOT NULL,
  anno        INTEGER CHECK (anno BETWEEN 1450 AND 2100),
  disponibile INTEGER NOT NULL DEFAULT 1,   -- SQLite non ha i booleani: 0 / 1
  autore_id   INTEGER NOT NULL REFERENCES autori(id)   -- chiave esterna
);

-- DROP TABLE libri;               cancella la tabella (e i dati!)
-- ALTER TABLE libri ADD COLUMN isbn TEXT;    aggiunge una colonna
</script>
  <script type="text/plain" id="c-select">
INSERT INTO libri (titolo, anno, autore_id)
VALUES ('Palomar', 1983, 1);              -- le colonne non indicate: DEFAULT o NULL

SELECT titolo, anno                       -- quali colonne (* = tutte)
FROM libri                                -- da quale tabella
WHERE anno < 1965 AND disponibile = 1     -- quali righe
ORDER BY anno DESC                        -- in che ordine (ASC è il predefinito)
LIMIT 10 OFFSET 0;                        -- quante (la paginazione!)

SELECT titolo FROM libri WHERE titolo LIKE '%rosa%';   -- % = qualunque testo
SELECT titolo FROM libri WHERE anno IS NULL;           -- mai "= NULL"
</script>

  <script type="text/plain" id="c-group">
SELECT COUNT(*) AS totale FROM libri;               -- una riga: 9

SELECT genere,
       COUNT(*)  AS quanti,                         -- per ogni gruppo
       MIN(anno) AS dal,
       MAX(anno) AS al
FROM libri
WHERE anno IS NOT NULL
GROUP BY genere                                     -- un gruppo per genere
HAVING COUNT(*) > 1                                 -- filtro SUI GRUPPI
ORDER BY quanti DESC;
</script>

  <script type="text/plain" id="c-modifica">
UPDATE libri
SET disponibile = 0, anno = 1958
WHERE id = 1;                -- ⚠️ senza WHERE: TUTTI i libri

DELETE FROM libri

const { DatabaseSync } = require('node:sqlite');   // incluso in Node 24: niente npm

const db = new DatabaseSync('biblioteca.db');      // il file viene creato se manca
db.exec(`CREATE TABLE IF NOT EXISTS libri (

const inserisci = db.prepare('INSERT INTO libri (titolo, anno) VALUES (?, ?)');
console.log(inserisci.run('Palomar', 1983));       // run: INSERT, UPDATE, DELETE

const trova = db.prepare('SELECT * FROM libri WHERE id = ?');
console.log(trova.get(1));                         // get: la prima riga (o undefined)
console.log(trova.get(99));

console.log(db.prepare('SELECT titolo FROM libri').all());   // all: tutte le righe
db.close();

  <script type="text/plain" id="c-repo">
// repositories/libri.js — l'UNICO file che conosce la tabella libri
const db = require('../db');

const BASE = `SELECT l.id, l.titolo, l.anno, l.disponibile, a.nome AS autore
              FROM libri l JOIN autori a ON a.id = l.autore_id`;
const daRiga = (r) => r && { ...r, disponibile: r.disponibile === 1 };   // 0/1 → booleano

function trova(id) {
  return daRiga(db.prepare(`${BASE} WHERE l.id = ?`).get(id));
}

function crea({ titolo, anno = null, autore_id }) {
  const { lastInsertRowid } = db.prepare(
    'INSERT INTO libri (titolo, anno, autore_id) VALUES (?, ?, ?)').run(titolo, anno, autore_id);
  return trova(lastInsertRowid);
}

function elimina(id) {
  return db.prepare('DELETE FROM libri WHERE id = ?').run(id).changes > 0;
}

module.exports = { trova, crea, elimina };   // stessi nomi del repository su file JSON
</script>
  <script type="text/plain" id="c-errori">
// middleware/errori.js — anche gli errori del database diventano risposte HTTP
function gestoreErrori(err, req, res, next) {
  // … ErroreApi, JSON non valido (modulo 7) …
  if (err.code === 'ERR_SQLITE_ERROR') {
    if (err.errcode === 2067) {          // UNIQUE: 'UNIQUE constraint failed: libri.isbn'
      return res.status(409).json({ errore: 'ISBN già presente' });
    }
    if (err.errcode === 787) {           // FOREIGN KEY: ci sono righe collegate
      return res.status(409).json({ errore: 'Ci sono dati collegati' });
    }
  }
  console.error(err);                    // tutto il resto è un bug → 500
  res.status(500).json({ errore: 'Errore interno del server' });
}
</script>
