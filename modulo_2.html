  <script type="text/plain" id="c-read">
const fs = require('node:fs/promises');

async function main() {
  try {
    const testo = await fs.readFile('saluto.txt', 'utf8');
    console.log(testo);
  } catch (err) {
    if (err.code === 'ENOENT') {
      console.error('File non trovato!');
    } else {
      throw err;   // errore inatteso: non nasconderlo
    }
  }
}

main();
</script>
  <script type="text/plain" id="c-write">
const fs = require('node:fs/promises');

async function main() {
  await fs.mkdir('log', { recursive: true });   // ok anche se esiste già

  await fs.writeFile('log/oggi.txt', 'Prima riga\n');     // crea o SOVRASCRIVE
  await fs.appendFile('log/oggi.txt', 'Seconda riga\n');  // aggiunge in fondo

  console.log(await fs.readFile('log/oggi.txt', 'utf8'));
}

main();
</script>

  <script type="text/plain" id="c-dir">
const fs = require('node:fs/promises');

async function elenca(cartella) {
  const voci = await fs.readdir(cartella, { withFileTypes: true });
  for (const voce of voci) {
    console.log(voce.isDirectory() ? `📁 ${voce.name}` : `📄 ${voce.name}`);
  }
}

elenca('.');

// Altre operazioni utili:
// await fs.stat('foto.jpg')            → { size, mtime, isFile(), ... }
// await fs.rename('a.txt', 'b.txt')    → rinomina / sposta
// await fs.rm('tmp', { recursive: true, force: true })  → come rm -rf
</script>
  <script type="text/plain" id="c-json">
const fs = require('node:fs/promises');
const path = require('node:path');

const FILE = path.join(__dirname, 'studenti.json');

async function aggiungiStudente(nome) {
  const studenti = JSON.parse(await fs.readFile(FILE, 'utf8'));  // testo → oggetti
  studenti.push({ id: studenti.length + 1, nome });
  await fs.writeFile(FILE, JSON.stringify(studenti, null, 2));   // oggetti → testo
  return studenti.length;
}

aggiungiStudente('Giulia')
  .then((n) => console.log(`Ora ci sono ${n} studenti`))
  .catch((err) => console.error('Errore:', err.message));
</script>
