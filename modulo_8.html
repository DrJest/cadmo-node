  <script type="text/plain" id="c-stringhe">
app.get('/', (req, res) => {
  let html = '<h1>Catalogo</h1><ul>';
  for (const l of libri) {
    html += `<li>${l.titolo} — ${l.autore}</li>`;
  }
  html += '</ul>';
  res.send(html);
});
</script>

  <script type="text/plain" id="c-render">
// npm install ejs
const express = require('express');
const app = express();

app.set('view engine', 'ejs');    // le viste sono file .ejs nella cartella views/

app.get('/', (req, res) => {
  const libri = [{ titolo: 'Il Gattopardo', anno: 1958 }];
  res.render('catalogo', { titolo: 'Catalogo', libri });   // → views/catalogo.ejs
});
</script>
  <script type="text/plain" id="c-ciclo">
<h1><%= titolo %></h1>

<% if (libri.length === 0) { %>
  <p>Nessun libro.</p>
<% } else { %>
  <p><%= libri.length %> <%= libri.length === 1 ? 'libro' : 'libri' %></p>
  <ul>
    <% libri.forEach((l) => { %>
      <li class="<%= l.disponibile ? '' : 'prestito' %>"><%= l.titolo %> (<%= l.anno ?? 'anno?' %>)</li>
    <% }) %>
  </ul>
<% } %>
</script>

// per TUTTE le viste: il nome del sito

// per le viste di QUESTA richiesta: un middleware

  res.locals.percorso = req.path;
  next();
});

  <script type="text/plain" id="c-urlencoded">
app.use(express.urlencoded());     // come express.json(), ma per i form

app.post('/libri', (req, res) => {
  req.body;
  // { titolo: 'Il Gattopardo', anno: '1958', genere: 'romanzo', disponibile: 'on' }
  //                                  ↑ una stringa              ↑ c'è solo se spuntata
});

// lo schema zod converte le stringhe
const vuotoComeAssente = (v) => (typeof v === 'string' && v.trim() === '' ? undefined : v);
const libroForm = z.object({
  titolo: z.string().trim().min(1, 'Il titolo è obbligatorio'),
  anno: z.preprocess(vuotoComeAssente, z.coerce.number().int().optional()),   // '' → assente
  disponibile: z.stringbool().default(false),                                  // 'on' → true
});
</script>
  <script type="text/plain" id="c-errori">
router.post('/libri', (req, res) => {
  const r = libroForm.safeParse(req.body);
  if (!r.success) {
    return res.status(422).render('nuovo', {
      valori: req.body,                               // quello che l'utente aveva scritto
      errori: z.flattenError(r.error).fieldErrors,    // { titolo: ['Il titolo è obbligatorio'] }
    });
  }
  const libro = libri.crea(r.data);
  res.redirect(303, `/libri/${libro.id}`);            // tutto bene: Post/Redirect/Get
});

// views/nuovo.ejs
//   <input name="titolo" value="<%= valori.titolo %>">
//   <% if (errori.titolo) { %><p class="errore"><%= errori.titolo[0] %></p><% } %>
</script>
